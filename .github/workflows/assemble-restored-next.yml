name: Assemble restored Next.js

on:
  push:
    branches:
      - agent/recover-legacy-content

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct restored Next.js files
        run: |
          base64 -d recovery/payload-page.gz.b64 | gzip -d > app/page.tsx
          base64 -d recovery/payload-globals.gz.b64 | gzip -d > app/globals.css
          base64 -d recovery/payload-layout.gz.b64 | gzip -d > app/layout.tsx
          mkdir -p data public
          cp recovery/compact-content.json data/legacy-content.json
          git show 89496a31d47ad6d6529361f75f8d20694cd8ed53:beki-autocar-futuristic-1.html > public/original-site.html
      - name: Install and production build
        run: |
          npm install
          npm run build
      - name: Commit validated restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css app/layout.tsx data/legacy-content.json public/original-site.html
          git commit -m "Assemble validated original-content Next.js site" || exit 0
          git push
